# # Name workflow
name: sitemap-hydration-tests

# When launch auto-tests
on:
  schedule:
    - cron: '00 4 * * 5'

  # Manual hook for launch
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment'
        required: true
        type: choice
        options:
          - STG
          - PROD
        default: 'PROD'

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  SLACK_CHAT_ID: ${{ secrets.SLACK_CHAT_ID }}
  SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}

jobs:
  sitemap-hydration-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      REPORT_NAME: sitemap-hydration
      TESTS_NAME: 'Sitemap-Hydration'
    steps:
      - name: Clone the code from repository into runner (virtual machine)
        uses: actions/checkout@v6.0.2

      - name: Setup nodejs
        uses: actions/setup-node@v6.3.0
        with:
          node-version: lts/*

      - name: Setup Java 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm
        run: npm i

      - name: Install PW with dependencies
        run: npx playwright install --with-deps chromium

      - name: Run sitemap/hydration tests
        env:
          URL_SITEMAP: ${{ (github.event.inputs.environment == 'PROD' || github.event_name == 'schedule') && secrets.PROD_SITEMAP_URL || secrets.STG_SITEMAP_URL }}
          BASE_URL: ${{ (github.event.inputs.environment == 'PROD' || github.event_name == 'schedule') && secrets.PROD_URL || secrets.STG_URL }}
        run: npm test -- --project hydration-tests

      - name: Get previous report Allure history
        uses: actions/checkout@v6.0.2
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Create allure-report from allure-results
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          subfolder: ${{ env.REPORT_NAME }}
          keep_reports: 10

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          publish_branch: gh-pages
          publish_dir: allure-history/${{ env.REPORT_NAME }}
          destination_dir: ${{ env.REPORT_NAME }}

      - name: Generate config.json with the secrets
        if: always()
        continue-on-error: true
        run: |
          mkdir -p notifications/tmp
          APP_VERSION=$(sed -n "s/^App\\\\ Version=//p" allure-results/environment.properties 2>/dev/null)
          sed \
            -e "s|\$TESTS_NAME|${{ env.TESTS_NAME }}|g" \
            -e "s|\$SLACK_CHAT_ID|${{ secrets.SLACK_CHAT_ID }}|g" \
            -e "s|\$SLACK_TOKEN|${{ secrets.SLACK_TOKEN }}|g" \
            -e "s|\$TELEGRAM_BOT_TOKEN|${{ secrets.TELEGRAM_BOT_TOKEN }}|g" \
            -e "s|\$TELEGRAM_CHAT_ID|${{ secrets.TELEGRAM_CHAT_ID }}|g" \
            -e "s|\$REPORT_LINK_SLACK|${{ secrets.GH_PAGES_BASE_URL }}/${{ env.REPORT_NAME }}|g" \
            -e "s|\$BASE_URL|${{ (github.event.inputs.environment == 'PROD' || github.event_name == 'schedule') && 'https://mobalytics.gg' || 'https://stg.mobalytics.gg' }}|g" \
            -e "s|\$APP_VERSION|${APP_VERSION:-unknown}|g" \
            notifications/config.json > notifications/tmp/config.json

      - name: Send Telegram & Slack notification
        if: always()
        continue-on-error: true
        run: |
          java "-DconfigFile=notifications/tmp/config.json" -jar notifications/allure-notifications-4.11.0.jar
